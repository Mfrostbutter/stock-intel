<script>
// Wraps signed numbers (+1.3%, -0.12, -$40) in rendered markdown with gain/loss classes. Text nodes only, so links and dates are untouched.
const SIGNED_NUM = /(^|[\s(|,:])([+-]\$?\d[\d,]*(?:\.\d+)?%?)(?=$|[\s)|,.;:])/g;
function colorSigned(html, up = 'text-ok', down = 'text-danger') {
  if (!html || !/[+-]\$?\d/.test(html)) return html;
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  const walker = document.createTreeWalker(tpl.content, NodeFilter.SHOW_TEXT);
  const hits = [];
  for (let n = walker.nextNode(); n; n = walker.nextNode()) if (n.nodeValue.search(SIGNED_NUM) >= 0) hits.push(n);
  for (const n of hits) {
    if (n.parentNode.closest('a, code, pre')) continue;
    const span = document.createElement('span');
    span.innerHTML = n.nodeValue.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
      .replace(SIGNED_NUM, (m, pre, v) => `${pre}<span class="${v[0] === '+' ? up : down}">${v}</span>`);
    n.replaceWith(...span.childNodes);
  }
  return tpl.innerHTML;
}

function stockIntel() {
  return {
    version: '0.4.2',
    token: '', tokenInput: '',
    screen: 'today',
    toasts: [],
    busy: { run: false, add: false, config: false, pos: false, analyze: false, feedback: false, test: '', entry: false, signal: false },

    reports: [], report: null, scores: [], selectedDate: '',
    analysis: null, source: null, fbNote: '', analysisTimer: null,
    dataHealth: null,
    spend: { spent: 0, cap: null, count: 0, remaining: null, pct_used: null, as_of: null }, spendTimer: null, SPEND_MS: 120000,
    spendModal: false, spendDetail: null, spendBusy: false,
    watchlist: [], allTags: [], counts: { active: 0, retired: 0 },
    editModal: false, editForm: { ticker: '', name: '', tags: '', benchmark: false, target_entry: '', notes: '' },
    positions: [],

    entries: [], entryCounts: { watching: 0, triggered: 0, entered: 0, dropped: 0 }, entryRunning: [], entryLastPass: null,
    entryNearPct: 0.03, entryShowAll: false, entryOpen: null, entryTimer: null, esig: null,
    entryModal: false,
    entryForm: { ticker: '', zone_low: '', zone_high: '', invalidation: '', horizon: 'weeks', status: 'watching', thesis: '', notes: '', existing: false },
    sourceCache: {},

    tickerSym: '',
    tk: { row: null, bars: [], news: [], scores: [], history: [], markers: [] },
    tkDays: 365,
    tkRanges: [{ label: '3M', days: 90 }, { label: '6M', days: 180 },
               { label: '1Y', days: 365 }, { label: '2Y', days: 730 }],
    charts: [],

    quotes: {}, quoteAt: null, quoteFeed: null, marketOpen: false, quoteError: null,
    quoteTimer: null,
    QUOTE_MS: 60000,
    runs: [],
    cfg: {}, cfgRaw: {}, configUpdated: {}, weights: { momentum: 0.3, value: 0.25, sentiment: 0.25, catalyst: 0.2 },
    telegram: { chat_id: '', send_document: true },
    newsDomainsText: '',
    providers: [], providerKinds: {}, showAddProv: false, newProv: { id: '', name: '', kind: 'openrouter', base_url: '', key_env: '' },
    catalogs: {}, testResult: {},
    roleDefs: [
      { key: 'analyst_model', label: 'Analyst', hint: 'plan, gather and draft' },
      { key: 'analyst_cheap_model', label: 'Critic', hint: 'critique pass and article summaries' },
      { key: 'analyst_deep_model', label: 'Deep', hint: 'weekly pass over five briefs' },
    ],
    roles: { analyst_model: { provider: 'openrouter', model: '', q: '' }, analyst_cheap_model: { provider: 'openrouter', model: '', q: '' }, analyst_deep_model: { provider: 'openrouter', model: '', q: '' } },
    bakeoff: [], bakeAdd: { provider: 'openrouter', model: '', q: '' },

    wlSearch: '', wlTag: '', wlShowRetired: false,
    sort: { key: 'composite', dir: 'desc' },

    addModal: false,
    addForm: { ticker: '', tags: '', target_entry: '', notes: '' },
    posModal: false,
    posForm: { ticker: '', mode: 'dollars', amount: '', fill_price: '', qty: '', avg_cost: '', opened_at: '', notes: '', existing: false },
    drawer: null,

    get navItems() {
      return [
        { key: 'today',     label: 'Today',     icon: 'newspaper' },
        { key: 'reports',   label: 'Reports',   icon: 'files', count: this.reports.length || null },
        { key: 'entries',   label: 'Entries',   icon: 'crosshair', count: this.liveEntries.length || null },
        { key: 'watchlist', label: 'Watchlist', icon: 'list-checks', count: this.counts.active || null },
        { key: 'runs',      label: 'Runs',      icon: 'activity' },
        { key: 'settings',  label: 'Settings',  icon: 'settings' },
      ];
    },

    // Derive qty/avg_cost/basis from the active entry mode. Dollars mode mirrors a broker
    // fractional fill (amount spent + fill price); shares mode is manual qty + avg cost.
    get posComputed() {
      const f = this.posForm;
      if (f.mode === 'dollars') {
        const amt = parseFloat(f.amount), px = parseFloat(f.fill_price);
        const ok = Number.isFinite(amt) && amt > 0 && Number.isFinite(px) && px > 0;
        return { qty: ok ? amt / px : NaN, avg_cost: ok ? px : NaN, basis: ok ? amt : NaN };
      }
      const q = parseFloat(f.qty), c = parseFloat(f.avg_cost);
      const okq = Number.isFinite(q) && q > 0;
      return { qty: okq ? q : NaN, avg_cost: Number.isFinite(c) ? c : NaN,
               basis: (okq && Number.isFinite(c)) ? q * c : NaN };
    },
    get posBasis() {
      const b = this.posComputed.basis;
      return Number.isFinite(b) ? this.money(b) : '-';
    },
    get posShares() {
      const q = this.posComputed.qty;
      return Number.isFinite(q) ? (Math.round(q * 1e6) / 1e6).toString() : '-';
    },

    get posAsOf() { return this.positions.length ? this.positions[0].price_as_of : null; },

    get tkPosition() { return this.liveHoldings.rows.find(p => p.ticker === this.tickerSym) || null; },

    get tkEntry() { return this.entries.find(e => e.ticker === this.tickerSym) || null; },

    get liveEntries() { return this.entries.filter(e => e.status === 'watching' || e.status === 'triggered'); },

    // Daily analyst spend counter (Today card + sidebar line).
    get spendPct() { const c = this.spend.cap; if (!c) return 0; return Math.max(0, Math.min(100, Math.round((this.spend.spent / c) * 100))); },
    get spendClass() { const p = this.spend.pct_used; if (p == null) return 'text-ink-700'; return p >= 1 ? 'text-danger' : (p >= 0.8 ? 'text-warn' : 'text-ok'); },
    get spendBarClass() { const p = this.spend.pct_used; if (p == null) return 'bg-brand-600'; return p >= 1 ? 'bg-danger' : (p >= 0.8 ? 'bg-warn' : 'bg-ok'); },

    // Today card: anything the rule layer or the analyst puts at enter or near.
    get hotEntries() {
      const hot = s => s === 'enter' || s === 'near';
      return this.liveEntries.filter(e => hot(e.signal) || hot(e.rule.signal));
    },

    get liveQuoteCount() { return Object.keys(this.quotes).length; },

    // Positions revalued against the last trade when a quote is in hand, otherwise the
    // stored close. Weights and totals are recomputed from whatever each row ended up using.
    get liveHoldings() {
      const rows = this.positions.map(p => {
        const q = this.quotes[p.ticker];
        if (!q || q.price == null) return { ...p, live: false };
        const price = q.price;
        const gain = p.avg_cost == null ? null : p.qty * (price - p.avg_cost);
        return {
          ...p, live: true, last_close: price,
          market_value: p.qty * price,
          gain,
          gain_pct: p.avg_cost ? (price - p.avg_cost) / p.avg_cost : null,
          day_change: q.prev_close == null ? null : p.qty * (price - q.prev_close),
        };
      });
      const equity = rows.reduce((a, r) => a + (r.market_value || 0), 0);
      for (const r of rows) r.weight = (equity && r.market_value) ? r.market_value / equity : null;
      const cost = rows.reduce((a, r) => a + (r.cost_basis || 0), 0);
      const gain = rows.reduce((a, r) => a + (r.gain || 0), 0);
      return {
        rows,
        anyLive: rows.some(r => r.live),
        total: {
          count: rows.length,
          cost_basis: cost || null,
          market_value: equity || null,
          gain: rows.length ? gain : null,
          gain_pct: cost ? gain / cost : null,
          day_change: rows.length ? rows.reduce((a, r) => a + (r.day_change || 0), 0) : null,
        },
      };
    },

    get tkHasSentiment() { return this.tk.news.some(a => a.sentiment !== null); },

    get tkFlagRows() {
      return this.tk.scores
        .filter(s => (s.flags || []).length || (s.risks || []).length)
        .sort((a, b) => (a.as_of < b.as_of ? 1 : -1));
    },

    get tkStats() {
      const r = this.tk.row, b = this.tk.bars.length ? this.tk.bars[this.tk.bars.length - 1] : null;
      const q = this.quotes[this.tickerSym] || null;
      if (!r && !b) return [];
      const dist = (v) => (b && b.close && v ? this.pct((b.close - v) / v) : '-');
      return [
        { k: q ? 'Last' : 'Close', v: this.num(q ? q.price : (b ? b.close : (r && r.close)), 2),
          cls: q ? 'text-brand-600' : '' },
        { k: '1d', v: this.pct(q ? q.change_pct : (r && r.ret_1d)),
          cls: this.signClass(q ? q.change_pct : (r && r.ret_1d)) },
        { k: '5d',     v: this.pct(r && r.ret_5d),  cls: this.signClass(r && r.ret_5d) },
        { k: '20d',    v: this.pct(r && r.ret_20d), cls: this.signClass(r && r.ret_20d) },
        { k: 'RSI 14', v: this.num(b ? b.rsi14 : (r && r.rsi14), 1) },
        { k: 'Vol z',  v: this.num(b ? b.vol_z20 : (r && r.vol_z20), 2) },
        { k: 'ATR 14', v: this.num(b && b.atr14, 2) },
        { k: 'Comp',   v: this.num(r && r.composite, 1) },
        { k: 'vs SMA20',  v: dist(b && b.sma20) },
        { k: 'vs SMA50',  v: dist(b && b.sma50) },
        { k: 'vs SMA200', v: dist(b && b.sma200) },
        { k: '52w high',  v: this.num(r && r.hi52w, 2) },
        { k: '52w low',   v: this.num(r && r.lo52w, 2) },
        { k: 'From high', v: this.pct(r && r.pct_from_hi52w), cls: this.signClass(r && r.pct_from_hi52w) },
        { k: 'Sent 7d',   v: this.num(r && r.news_score, 2), cls: this.signClass(r && r.news_score) },
        { k: 'Target',    v: this.num(r && r.target_entry, 2) },
      ];
    },

    get filteredWatchlist() {
      const q = this.wlSearch.trim().toLowerCase();
      let rows = this.watchlist.filter(w => {
        if (!this.wlShowRetired && !w.active) return false;
        if (this.wlTag && !(w.tags || []).includes(this.wlTag)) return false;
        if (!q) return true;
        return (w.ticker + ' ' + (w.name || '')).toLowerCase().includes(q);
      });
      const { key, dir } = this.sort;
      const mult = dir === 'asc' ? 1 : -1;
      return rows.sort((a, b) => {
        const av = a[key], bv = b[key];
        if (av == null && bv == null) return 0;
        if (av == null) return 1;
        if (bv == null) return -1;
        const an = Number(av), bn = Number(bv);
        if (!Number.isNaN(an) && !Number.isNaN(bn)) return (an - bn) * mult;
        return String(av).localeCompare(String(bv)) * mult;
      });
    },

    // ---------- boot / routing ----------
    async boot() {
      this.token = localStorage.getItem('stock_intel_token') || '';
      this.applyHash();
      window.addEventListener('hashchange', () => { this.applyHash(); this.loadScreen(); });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) this.loadQuotes(); });
      document.addEventListener('click', (ev) => { const b = ev.target.closest && ev.target.closest('button.cite'); if (b) this.openSource(b.dataset.ref, b.dataset.aid); });
      if (this.token) await this.loadAll();
      this.startQuotePolling();
      this.startSpendPolling();
      this.refreshIcons();
    },

    applyHash() {
      const h = (window.location.hash || '').replace('#', '');
      if (h.startsWith('ticker/')) {
        const sym = decodeURIComponent(h.slice(7)).toUpperCase();
        if (sym) { this.screen = 'ticker'; this.tickerSym = sym; return; }
      }
      this.screen = ['today', 'reports', 'entries', 'watchlist', 'runs', 'settings'].includes(h) ? h : 'today';
    },

    openTicker(sym) { window.location.hash = 'ticker/' + sym; },

    async loadAll() {
      await Promise.all([this.loadReports(), this.loadWatchlist(), this.loadPositions(), this.loadQuotes(), this.loadEntries(), this.loadSpend(), this.loadDataHealth()]);
      if (this.reports.length) await this.loadReport(this.reports[0].as_of);
      await this.loadScreen();
    },

    async loadScreen() {
      if (!this.token) return;
      if (this.screen !== 'ticker') this.destroyCharts();
      if (this.screen === 'runs') await this.loadRuns();
      if (this.screen === 'settings') await this.loadSettings();
      if (this.screen === 'ticker') await this.loadTicker();
      if (this.screen === 'entries') await this.loadEntries();
      this.refreshIcons();
    },

    // ---------- entry watch ----------
    async loadEntries() {
      clearTimeout(this.entryTimer);
      try {
        const d = await this.api('GET', '/api/entries' + (this.entryShowAll ? '?include_dropped=true' : ''));
        this.entries = this.entryShowAll ? d.entries : d.entries.filter(e => e.status !== 'entered');
        this.entryCounts = d.counts; this.entryRunning = d.running || []; this.entryNearPct = d.near_pct || 0.03;
        this.entryLastPass = d.last_pass || null;
        // A pass in flight lands within a few minutes; poll until it does.
        if (this.entryRunning.length) this.entryTimer = setTimeout(() => this.loadEntries(), 8000);
        this.loadSpend();   // entry passes cost money; keep the counter current as they land
      } catch (e) { this.toast('Entries: ' + e.message, 'error'); }
      this.refreshIcons();
    },

    livePrice(e) { const q = this.quoteFor(e.ticker); return q && q.price != null ? q.price : e.close; },

    // Signed distance from the zone as a fraction of the live price. Zero inside, null without a zone.
    liveDist(e) {
      const p = this.livePrice(e);
      if (p == null || (e.zone_low == null && e.zone_high == null)) return null;
      const lo = e.zone_low != null ? e.zone_low : e.zone_high, hi = e.zone_high != null ? e.zone_high : e.zone_low;
      if (p >= lo && p <= hi) return 0;
      return p > hi ? (p - hi) / p : (p - lo) / p;
    },
    distText(e) {
      const d = this.liveDist(e);
      if (d === null) return '-';
      if (d === 0) return 'in zone';
      return (d > 0 ? '+' : '') + (d * 100).toFixed(1) + '%';
    },
    distClass(e) {
      const d = this.liveDist(e);
      if (d === null) return 'text-ink-400';
      if (d === 0) return 'text-ok font-medium';
      return Math.abs(d) <= this.entryNearPct ? 'text-warn' : (d < 0 ? 'text-danger' : 'text-ink-600');
    },
    // Add rows: live price against the average cost. Below zero is the only place adding lowers it.
    liveVsCost(e) {
      if (e.kind !== 'add' || e.avg_cost == null || Number(e.avg_cost) <= 0) return null;
      const p = this.livePrice(e);
      return p == null ? null : (p - Number(e.avg_cost)) / Number(e.avg_cost);
    },
    costText(e) { const v = this.liveVsCost(e); return v === null ? '-' : (v > 0 ? '+' : '') + (v * 100).toFixed(1) + '%'; },
    costClass(e) { const v = this.liveVsCost(e); return v === null ? 'text-ink-400' : (v < 0 ? 'text-ok' : 'text-ink-600'); },
    zoneText(e) {
      if (e.zone_low == null && e.zone_high == null) return 'no zone';
      return this.num(e.zone_low != null ? e.zone_low : e.zone_high, 2) + ' - ' + this.num(e.zone_high != null ? e.zone_high : e.zone_low, 2);
    },
    sigClass(s) { return s === 'enter' ? 'pill-flag' : (s === 'near' ? 'pill-warn' : (s === 'avoid' ? 'pill-risk' : 'pill-hold')); },
    statusClass(s) { return s === 'entered' ? 'pill-hold' : (s === 'triggered' ? 'pill-flag' : (s === 'dropped' ? 'pill-bench' : 'pill-tag')); },
    ago(ts) {
      const m = Math.max(0, Math.round((Date.now() - new Date(ts)) / 60000));
      if (m < 60) return m + 'm';
      if (m < 60 * 36) return Math.round(m / 60) + 'h';
      return Math.round(m / 1440) + 'd';
    },

    toggleEntry(e) { this.entryOpen = this.entryOpen === e.ticker ? null : e.ticker; if (this.entryOpen !== (this.esig && this.esig.ticker)) this.esig = null; this.refreshIcons(); },

    async loadEntryHistory(ticker) {
      try { this.esig = await this.api('GET', '/api/entries/' + ticker + '/signals'); }
      catch (e) { this.toast(ticker + ': ' + e.message, 'error'); }
      this.refreshIcons();
    },

    openEntry(row) {
      const e = row && row.status ? row : null;
      this.entryForm = {
        ticker: row ? row.ticker : '',
        zone_low: e && e.zone_low != null ? e.zone_low : '',
        zone_high: e && e.zone_high != null ? e.zone_high : '',
        invalidation: e && e.invalidation != null ? e.invalidation : '',
        horizon: e ? e.horizon : 'weeks',
        status: e ? e.status : 'watching',
        kind: e ? (e.kind || 'new') : 'new', qty: e ? e.qty : null, avg_cost: e ? e.avg_cost : null, zone_cap: e ? e.zone_cap : null,
        thesis: e ? (e.thesis || '') : '',
        notes: e ? (e.notes || '') : '',
        existing: !!e,
      };
      this.entryModal = true;
      this.$nextTick(() => this.refreshIcons());
    },

    async saveEntry() {
      const f = this.entryForm;
      const ticker = (f.ticker || '').trim().toUpperCase();
      if (!ticker) { this.toast('Ticker required', 'error'); return; }
      const n = v => (v === '' || v === null || v === undefined) ? null : parseFloat(v);
      const body = { zone_low: n(f.zone_low), zone_high: n(f.zone_high), invalidation: n(f.invalidation),
                     horizon: f.horizon, thesis: f.thesis || null, notes: f.notes || null };
      if (body.zone_low != null && body.zone_high != null && body.zone_low > body.zone_high) { this.toast('Zone low is above zone high', 'error'); return; }
      this.busy.entry = true;
      try {
        let d;
        if (f.existing) d = await this.api('PATCH', '/api/entries/' + ticker, { ...body, status: f.status });
        else d = await this.api('POST', '/api/entries', { ticker, ...body });
        this.entryModal = false;
        const added = d.added_to_watchlist;
        const noZone = body.zone_low == null && body.zone_high == null;
        this.toast(ticker + (f.existing ? ' updated' : ' on the entry watch list') +
                   (added ? ' (added to the watchlist, ' + (added.backfill.fired ? 'backfill fired' : (added.backfill.reason || 'no backfill')) + ')' : '') +
                   (!f.existing && d.signal && d.signal.fired ? (noZone ? '. The analyst is proposing a zone, about a minute.' : '. Analyst pass started.') : '') +
                   (!f.existing && d.signal && !d.signal.fired && d.signal.reason ? '. Analyst not started: ' + d.signal.reason : ''), 'success', 8000);
        await this.loadEntries();
        if (added) await this.loadWatchlist();
        if (this.screen === 'ticker') this.$nextTick(() => { this.destroyCharts(); this.drawCharts(); });
      } catch (e) { this.toast(ticker + ': ' + e.message, 'error', 8000); }
      this.busy.entry = false;
      this.refreshIcons();
    },

    // The suggestion is applicable when it is grounded and differs from what the row holds.
    canApplyZone(e) {
      const z = e.suggested_zone;
      if (!z || z.low == null || z.high == null || z.ungrounded) return false;
      return e.zone_low !== z.low || e.zone_high !== z.high;
    },
    async acceptZone(e) {
      this.busy.entry = true;
      try {
        await this.api('POST', '/api/entries/' + e.ticker + '/accept-zone');
        this.toast(e.ticker + ': zone ' + this.num(e.suggested_zone.low) + ' to ' + this.num(e.suggested_zone.high) + ' applied', 'success');
        await this.loadEntries();
      } catch (err) { this.toast(e.ticker + ': ' + err.message, 'error'); }
      this.busy.entry = false;
      this.refreshIcons();
    },

    async dropEntry(ticker) {
      if (!confirm('Drop ' + ticker + ' from the entry watch list? Its history and signals are kept.')) return;
      this.busy.entry = true;
      try {
        await this.api('DELETE', '/api/entries/' + ticker);
        this.entryModal = false;
        this.toast(ticker + ' dropped', 'success');
        await this.loadEntries();
      } catch (e) { this.toast(ticker + ': ' + e.message, 'error'); }
      this.busy.entry = false;
    },

    // Entered: mark the row, then open the position editor so the fill is recorded.
    // Add rows come back as watching with the zone cleared; the next pass proposes the next dip.
    async enterEntry(e) {
      try {
        await this.api('PATCH', '/api/entries/' + e.ticker, { status: 'entered' });
        this.toast(e.kind === 'add' ? e.ticker + ' add recorded. Update the position, then signal for the next dip zone.'
                                    : e.ticker + ' marked entered. Record the fill.', 'success', 6000);
        await this.loadEntries();
        this.openPosition({ ticker: e.ticker, qty: e.qty, avg_cost: e.avg_cost != null ? e.avg_cost : this.livePrice(e) });
      } catch (err) { this.toast(e.ticker + ': ' + err.message, 'error'); }
    },

    async signalEntries(tickers) {
      this.busy.signal = true;
      try {
        const d = await this.api('POST', '/api/entries/signal', tickers ? { tickers } : {});
        const n = d.analyses.length;
        this.toast(n ? n + ' entry pass' + (n === 1 ? '' : 'es') + ' started for ' + d.tickers.length + ' tickers'
                     : 'Already running for ' + d.already_running.join(', '), 'success', 6000);
        await this.loadEntries();
      } catch (e) { this.toast('Signal: ' + e.message, 'error', 8000); }
      this.busy.signal = false;
      this.refreshIcons();
    },

    // ---------- HTTP ----------
    async api(method, path, body) {
      if (!this.token) throw new Error('No token');
      const opts = { method, headers: { 'Authorization': 'Bearer ' + this.token } };
      if (body !== undefined) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      const resp = await fetch(path, opts);
      if (resp.status === 401 || resp.status === 403) {
        this.toast('Auth rejected (' + resp.status + '). Re-enter token.', 'error');
        this.clearToken();
        throw new Error('auth_failed');
      }
      const text = await resp.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch (e) { /* leave raw */ }
      if (!resp.ok) {
        const d = (data && (data.detail?.detail || data.detail || data.error)) || text || ('HTTP ' + resp.status);
        throw new Error(typeof d === 'string' ? d : JSON.stringify(d));
      }
      return data;
    },

    // ---------- loaders ----------
    async loadReports() {
      try {
        const d = await this.api('GET', '/api/reports?limit=90');
        this.reports = d.reports;
      } catch (e) { this.toast('Reports: ' + e.message, 'error'); }
    },

    async loadReport(as_of) {
      if (!as_of) return;
      this.selectedDate = as_of;
      try {
        this.report = await this.api('GET', '/api/reports/' + as_of);
        const s = await this.api('GET', '/api/reports/' + as_of + '/scores');
        this.scores = s.scores;
        await this.loadAnalysis(this.report.analysis ? this.report.analysis.id : null);
      } catch (e) {
        this.report = null; this.scores = []; this.analysis = null;
        this.toast('Brief: ' + e.message, 'error');
      }
      this.refreshIcons();
    },

    openReport(as_of) { window.location.hash = 'today'; this.loadReport(as_of); },

    async loadWatchlist() {
      try {
        const d = await this.api('GET', '/api/watchlist');
        this.watchlist = d.watchlist;
        this.allTags = d.tags;
        this.counts = { active: d.active, retired: d.retired };
      } catch (e) { this.toast('Watchlist: ' + e.message, 'error'); }
    },

    async loadPositions() {
      try {
        const d = await this.api('GET', '/api/positions');
        this.positions = d.positions;
      } catch (e) { this.toast('Positions: ' + e.message, 'error'); }
    },

    // ---------- live quotes ----------
    startQuotePolling() {
      if (this.quoteTimer) clearInterval(this.quoteTimer);
      this.quoteTimer = setInterval(() => {
        // Nothing to gain from polling a hidden tab or a closed market.
        if (document.hidden || !this.token || !this.marketOpen) return;
        this.loadQuotes();
      }, this.QUOTE_MS);
    },

    startSpendPolling() {
      if (this.spendTimer) clearInterval(this.spendTimer);
      // Spend changes from scheduled/background passes too (06:00 daily, hourly entry), so poll
      // regardless of market state; skip only a hidden tab.
      this.spendTimer = setInterval(() => {
        if (document.hidden || !this.token) return;
        this.loadSpend();
        this.loadDataHealth();
      }, this.SPEND_MS);
    },

    healthHeadline(h) {
      if (!h) return '';
      const bad = (h.checks || []).filter(c => !c.ok).map(c => c.key);
      if (bad.some(k => k === 'prices' || k === 'scores' || k === 'report')) return 'Pipeline data is stale';
      if (bad.includes('run')) return 'Last daily run had problems';
      if (bad.includes('analysis')) return 'Daily analysis is missing';
      if (bad.includes('coverage')) return 'Some tickers have no price';
      return 'Pipeline status ' + h.status;
    },

    async loadDataHealth() {
      if (!this.token) return;
      try { this.dataHealth = await this.api('GET', '/api/health/data'); } catch (e) { /* non-fatal: keep last value */ }
    },

    async loadSpend() {
      if (!this.token) return;
      try { this.spend = await this.api('GET', '/api/analyst/spend'); } catch (e) { /* non-fatal: keep last value */ }
    },

    async openSpend() {
      this.spendModal = true;
      this.spendBusy = true;
      try {
        this.spendDetail = await this.api('GET', '/api/analyst/spend/detail');
        this.spend = { as_of: this.spendDetail.as_of, spent: this.spendDetail.spent, cap: this.spendDetail.cap,
                       count: this.spendDetail.count, remaining: this.spendDetail.remaining, pct_used: this.spendDetail.pct_used };
      } catch (e) { this.toast('Spend detail: ' + e.message, 'error'); }
      this.spendBusy = false;
      this.$nextTick(() => this.refreshIcons());
    },

    async loadQuotes() {
      if (!this.token) return;
      try {
        const d = await this.api('GET', '/api/quotes');
        this.quotes = d.quotes || {};
        this.quoteAt = d.fetched_at;
        this.quoteFeed = d.feed;
        this.marketOpen = d.market_open;
        this.quoteError = d.error || null;
      } catch (e) {
        this.quoteError = e.message;      // stale prices beat a blank screen
      }
    },

    quoteFor(ticker) { return this.quotes[ticker] || null; },

    async loadTicker() {
      const sym = this.tickerSym;
      this.destroyCharts();
      this.tk = { row: null, bars: [], news: [], scores: [], history: [], markers: [] };
      if (!this.watchlist.length) await this.loadWatchlist();
      if (!this.positions.length) await this.loadPositions();
      this.tk.row = this.watchlist.find(w => w.ticker === sym) || null;

      try {
        const [pr, nw, sc] = await Promise.all([
          this.api('GET', `/api/tickers/${sym}/prices?days=${this.tkDays}`),
          this.api('GET', `/api/tickers/${sym}/news?days=30`),
          this.api('GET', `/api/tickers/${sym}/scores?days=${Math.min(this.tkDays, 1000)}`),
        ]);
        if (this.tickerSym !== sym) return;            // navigated away mid-flight
        this.tk.bars = pr.bars; this.tk.news = nw.articles; this.tk.scores = sc.scores;
      } catch (e) { this.toast(sym + ': ' + e.message, 'error'); return; }

      if (this.tkPosition) {
        try {
          const h = await this.api('GET', `/api/positions/${sym}/history`);
          this.tk.history = h.history;
          this.tk.markers = this.positionMarkers(h.history);
        } catch (e) { /* markers are decoration, not a reason to fail the screen */ }
      }

      this.$nextTick(() => this.drawCharts());
      this.refreshIcons();
    },

    async setTickerRange(days) {
      this.tkDays = days;
      await this.loadTicker();
    },

    async patchTicker(changes) {
      if (!this.tk.row) return;
      await this.patch(this.tk.row, changes);
    },

    async loadRuns() {
      try { this.runs = (await this.api('GET', '/api/runs?limit=50')).runs; }
      catch (e) { this.toast('Runs: ' + e.message, 'error'); }
    },

    // ---------- settings ----------
    STRUCTURED_KEYS: ['analyst_model', 'analyst_cheap_model', 'analyst_deep_model', 'analyst_bakeoff_models', 'analyst_providers',
                      'analyst_daily_cap_usd', 'analyst_max_fetches', 'analyst_search_provider', 'analyst_hitl',
                      'analyst_share_positions_offsite', 'analyst_prompt_version', 'news_domains', 'notify_email',
                      'email_position_values', 'weights', 'quota', 'entry_signal_auto', 'entry_near_pct', 'entry_signal_batch',
                      'entry_watch_holdings', 'entry_dca_min_discount', 'app_base_url', 'telegram'],
    parseRef(ref) {
      ref = String(ref || '');
      const m = ref.match(/^([a-z][a-z0-9_-]{1,31}):(.+)$/);
      return m && !ref.startsWith('http') ? { provider: m[1], model: m[2] } : { provider: 'openrouter', model: ref };
    },
    makeRef(r) { return r.provider === 'openrouter' ? r.model : r.provider + ':' + r.model; },
    async loadSettings() {
      try {
        const [c, p] = await Promise.all([this.api('GET', '/api/config'), this.api('GET', '/api/providers')]);
        this.cfg = c.config; this.configUpdated = c.updated_at;
        this.cfgRaw = Object.fromEntries(Object.entries(c.config).map(([k, v]) => [k, JSON.stringify(v)]));
        this.weights = Object.assign({ momentum: 0, value: 0, sentiment: 0, catalyst: 0 }, c.config.weights || {});
        this.telegram = Object.assign({ chat_id: '', send_document: true }, c.config.telegram || {});
        this.newsDomainsText = (c.config.news_domains || []).join('\n');
        for (const r of this.roleDefs) { const ref = this.parseRef(c.config[r.key]); this.roles[r.key] = { provider: ref.provider, model: ref.model, q: '' }; }
        this.bakeoff = (c.config.analyst_bakeoff_models || []).map(x => this.parseRef(x));
        this.providers = p.providers; this.providerKinds = p.kinds;
        const enabled = this.providers.filter(x => x.enabled).map(x => x.id);
        await Promise.all(enabled.map(id => this.ensureCatalog(id)));
      } catch (e) { this.toast('Settings: ' + e.message, 'error'); }
      this.refreshIcons();
    },
    async ensureCatalog(pid, refresh = false) {
      if (!pid || (this.catalogs[pid] && !refresh)) return;
      try { this.catalogs[pid] = await this.api('GET', '/api/models?provider=' + encodeURIComponent(pid) + (refresh ? '&refresh=true' : '')); }
      catch (e) { this.catalogs[pid] = { models: [], source: 'error', error: e.message }; }
    },
    catalogHint(pid) {
      const c = this.catalogs[pid];
      if (!c) return 'loading catalog';
      if (c.source === 'fallback' || c.source === 'error') return 'catalog unavailable' + (c.key_present === false ? ' (key not set)' : '') + (c.error ? ': ' + c.error : '');
      const ago = c.cached_at ? Math.max(0, Math.round((Date.now() / 1000 - c.cached_at) / 60)) : 0;
      return c.models.length + ' models · synced ' + (ago < 1 ? 'just now' : ago + ' min ago');
    },
    filteredModels(pid, q, current) {
      const c = this.catalogs[pid]; if (!c) return [];
      const needle = (q || '').toLowerCase();
      let list = c.models.filter(m => !needle || m.id.toLowerCase().includes(needle) || (m.name || '').toLowerCase().includes(needle));
      list.sort((a, b) => a.id.localeCompare(b.id));
      if (list.length > 300) list = list.slice(0, 300);
      if (current && !list.some(m => m.id === current)) { const cur = c.models.find(m => m.id === current); if (cur) list.unshift(cur); }
      return list;
    },
    modelInCatalog(r) { const c = this.catalogs[r.provider]; return !r.model || !c || c.models.some(m => m.id === r.model); },
    isStale(r) { const c = this.catalogs[r.provider]; return !!(r.model && c && c.source !== 'fallback' && c.source !== 'error' && !c.models.some(m => m.id === r.model)); },
    modelMeta(r) {
      const c = this.catalogs[r.provider]; const m = c && c.models.find(x => x.id === r.model); if (!m) return '';
      const parts = [];
      if (m.price_in != null) parts.push('$' + m.price_in + ' in / $' + m.price_out + ' out per M');
      if (m.context) parts.push((m.context / 1000).toFixed(0) + 'k ctx');
      if (m.tools === false) parts.push('no tool calling'); if (m.structured === false) parts.push('no structured output');
      return parts.join(' · ');
    },
    modelLabel(m) {
      let l = m.id;
      if (m.price_in != null) l += '  ·  $' + m.price_in + ' / $' + m.price_out;
      if (m.tools === false) l += '  ·  no tools';
      return l;
    },
    newProvKind() { const k = this.providerKinds[this.newProv.kind] || {}; this.newProv.base_url = k.base_url || ''; this.newProv.key_env = k.key_env || ''; },
    addProvider() {
      const n = this.newProv;
      if (!n.id || !n.kind) { this.toast('Provider needs an id and a kind', 'error'); return; }
      if (this.providers.some(p => p.id === n.id)) { this.toast('Provider id already exists', 'error'); return; }
      this.providers.push({ id: n.id.toLowerCase(), name: n.name || n.id, kind: n.kind, base_url: n.base_url, key_env: n.key_env, enabled: true, key_present: false });
      this.newProv = { id: '', name: '', kind: 'openrouter', base_url: '', key_env: '' };
      this.showAddProv = false;
      this.refreshIcons();
    },
    removeProvider(i) {
      const id = this.providers[i].id;
      const used = this.roleDefs.some(r => this.roles[r.key].provider === id) || this.bakeoff.some(b => b.provider === id);
      if (used) { this.toast('A role or the bake-off set still uses ' + id, 'error'); return; }
      this.providers.splice(i, 1);
    },
    async testProvider(pid) {
      this.busy.test = pid;
      try { this.testResult[pid] = await this.api('POST', '/api/providers/' + pid + '/test'); }
      catch (e) { this.testResult[pid] = { ok: false, error: e.message }; }
      this.busy.test = ''; this.refreshIcons();
    },
    testSummary(pid) {
      const t = this.testResult[pid]; if (!t) return '';
      if (!t.ok) return 'failed: ' + (t.error || 'unknown');
      let s = 'ok · ' + t.models + ' models · ' + t.ms + ' ms';
      if (t.key && t.key.usage != null) s += ' · key used $' + Number(t.key.usage).toFixed(2) + (t.key.limit != null ? ' of $' + t.key.limit : '');
      if (!t.key_present) s += ' · key not set (catalog is public)';
      return s;
    },
    addBakeoff() {
      const r = { provider: this.bakeAdd.provider, model: this.bakeAdd.model };
      if (!r.model) return;
      if (!this.bakeoff.some(b => b.provider === r.provider && b.model === r.model)) this.bakeoff.push(r);
      this.bakeAdd.model = '';
    },
    weightSum() { return ['momentum', 'value', 'sentiment', 'catalyst'].reduce((a, k) => a + (Number(this.weights[k]) || 0), 0); },
    advancedKeys() { return Object.keys(this.cfgRaw).filter(k => !this.STRUCTURED_KEYS.includes(k)).sort(); },
    async saveSettings() {
      this.busy.config = true;
      const values = {};
      try {
        for (const r of this.roleDefs) { if (!this.roles[r.key].model) throw new Error(r.label + ' has no model'); values[r.key] = this.makeRef(this.roles[r.key]); }
        values.analyst_bakeoff_models = this.bakeoff.map(b => this.makeRef(b));
        for (const k of ['analyst_daily_cap_usd', 'analyst_max_fetches', 'analyst_search_provider', 'analyst_hitl', 'analyst_share_positions_offsite', 'notify_email', 'email_position_values',
                         'entry_signal_auto', 'entry_near_pct', 'entry_signal_batch', 'entry_watch_holdings', 'entry_dca_min_discount']) {
          if (this.cfg[k] !== undefined) values[k] = this.cfg[k];
        }
        values.analyst_daily_cap_usd = Number(values.analyst_daily_cap_usd); values.analyst_max_fetches = Number(values.analyst_max_fetches);
        values.analyst_hitl = !!values.analyst_hitl; values.analyst_share_positions_offsite = !!values.analyst_share_positions_offsite;
        if (values.entry_signal_auto !== undefined) values.entry_signal_auto = !!values.entry_signal_auto;
        if (values.entry_near_pct !== undefined) values.entry_near_pct = Number(values.entry_near_pct);
        if (values.entry_signal_batch !== undefined) values.entry_signal_batch = Math.max(1, Math.min(8, Number(values.entry_signal_batch) || 8));
        if (values.entry_watch_holdings !== undefined) values.entry_watch_holdings = !!values.entry_watch_holdings;
        if (values.entry_dca_min_discount !== undefined) values.entry_dca_min_discount = Math.max(0, Math.min(0.5, Number(values.entry_dca_min_discount) || 0));
        values.notify_email = !!values.notify_email; values.email_position_values = !!values.email_position_values;
        values.news_domains = this.newsDomainsText.split('\n').map(x => x.trim().toLowerCase()).filter(Boolean);
        values.weights = Object.fromEntries(['momentum', 'value', 'sentiment', 'catalyst'].map(k => [k, Number(this.weights[k]) || 0]));
        values.telegram = { chat_id: String(this.telegram.chat_id || '').trim(), send_document: !!this.telegram.send_document };
        if (values.app_base_url !== undefined) values.app_base_url = String(values.app_base_url || '').trim().replace(/\/+$/, '');
        if (Math.abs(this.weightSum() - 1) > 0.001) throw new Error('Score weights must sum to 1 (now ' + this.weightSum().toFixed(2) + ')');
        for (const k of ['quota', ...this.advancedKeys()]) { if (this.cfgRaw[k] !== undefined) values[k] = JSON.parse(this.cfgRaw[k]); }
      } catch (e) {
        this.toast(e.message, 'error'); this.busy.config = false; return;
      }
      try {
        await this.api('PUT', '/api/providers', { providers: this.providers.map(({ id, name, kind, base_url, key_env, enabled }) => ({ id, name, kind, base_url, key_env, enabled })) });
        await this.api('PUT', '/api/config', { values });
        this.toast('Settings saved', 'success');
        await this.loadSettings();
      } catch (e) { this.toast('Settings: ' + e.message, 'error'); }
      this.busy.config = false;
      this.refreshIcons();
    },

    // ---------- charts ----------
    destroyCharts() {
      // Disconnect the observer first. It outlives the chart otherwise and fires
      // applyOptions against a disposed object on every screen change.
      for (const c of this.charts) {
        try { c.ro.disconnect(); } catch (e) { /* never observed */ }
        try { c.chart.remove(); } catch (e) { /* already gone */ }
      }
      this.charts = [];
    },

    positionMarkers(history) {
      // Oldest first so the arrows read left to right with the price.
      return [...history].reverse().map(h => ({
        time: (h.changed_at || '').slice(0, 10),
        position: h.qty > 0 ? 'belowBar' : 'aboveBar',
        color: h.qty > 0 ? '#34d399' : '#f87171',
        shape: h.qty > 0 ? 'arrowUp' : 'arrowDown',
        text: h.qty > 0 ? this.num(h.qty, 3) + ' sh' : 'closed',
      }));
    },

    chartBase(el, height) {
      const chart = LightweightCharts.createChart(el, {
        width: el.clientWidth, height,
        layout: { background: { color: '#0a0e18' }, textColor: '#7ea8cc', fontFamily: 'IBM Plex Mono, monospace', fontSize: 11 },
        grid: { vertLines: { color: '#0d1526' }, horzLines: { color: 'rgba(56,189,248,0.08)' } },
        rightPriceScale: { borderColor: 'rgba(56,189,248,0.16)' },
        timeScale: { borderColor: 'rgba(56,189,248,0.16)' },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        handleScale: { axisPressedMouseMove: false },
      });
      const ro = new ResizeObserver(() => chart.applyOptions({ width: el.clientWidth }));
      ro.observe(el);
      this.charts.push({ chart, ro });
      return chart;
    },

    drawCharts() {
      if (!window.LightweightCharts) { this.toast('Chart library did not load', 'error'); return; }
      const bars = this.tk.bars;
      if (!bars.length || !this.$refs.chartPrice) return;

      // price + SMAs + volume
      const price = this.chartBase(this.$refs.chartPrice, 360);
      const candles = price.addCandlestickSeries({
        upColor: '#34d399', downColor: '#f87171', borderUpColor: '#34d399',
        borderDownColor: '#f87171', wickUpColor: '#34d399', wickDownColor: '#f87171',
      });
      candles.setData(bars.map(b => ({ time: b.as_of, open: b.open, high: b.high, low: b.low, close: b.close })));
      if (this.tk.markers.length) candles.setMarkers(this.tk.markers);

      for (const [key, color] of [['sma20', '#38bdf8'], ['sma50', '#f59e0b'], ['sma200', '#4a6a88']]) {
        const pts = bars.filter(b => b[key] != null).map(b => ({ time: b.as_of, value: b[key] }));
        if (pts.length) price.addLineSeries({ color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false }).setData(pts);
      }

      const vol = price.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol' });
      vol.priceScale().applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
      vol.setData(bars.map((b, i) => ({
        time: b.as_of, value: b.volume,
        color: (i > 0 && b.close < bars[i - 1].close) ? 'rgba(248,113,113,0.32)' : 'rgba(52,211,153,0.32)',
      })));

      if (this.tk.row && this.tk.row.target_entry) {
        candles.createPriceLine({
          price: this.tk.row.target_entry, color: '#38bdf8', lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Dashed, title: 'target',
        });
      }
      if (this.tkPosition && this.tkPosition.avg_cost) {
        candles.createPriceLine({
          price: this.tkPosition.avg_cost, color: '#f59e0b', lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Dotted, title: 'avg cost',
        });
      }
      // Entry zone as a pair of solid lines, invalidation in red.
      const en = this.tkEntry;
      if (en) {
        for (const [v, title] of [[en.zone_low, 'zone low'], [en.zone_high, 'zone high']]) {
          if (v != null) candles.createPriceLine({ price: v, color: '#34d399', lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Solid, title });
        }
        if (en.invalidation != null) candles.createPriceLine({ price: en.invalidation, color: '#f87171', lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, title: 'invalidation' });
      }

      // RSI, sharing the price chart's visible range
      const rsiPts = bars.filter(b => b.rsi14 != null).map(b => ({ time: b.as_of, value: b.rsi14 }));
      if (rsiPts.length && this.$refs.chartRsi) {
        const rsi = this.chartBase(this.$refs.chartRsi, 180);
        const line = rsi.addLineSeries({ color: '#38bdf8', lineWidth: 2, priceLineVisible: false });
        line.setData(rsiPts);
        for (const [v, c] of [[70, '#f87171'], [30, '#34d399']]) {
          line.createPriceLine({ price: v, color: c, lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, title: String(v) });
        }
        this.linkRanges(price, rsi);
      }

      // composite history
      const scPts = [...this.tk.scores]
        .filter(x => x.composite != null)
        .sort((a, b) => (a.as_of < b.as_of ? -1 : 1))
        .map(x => ({ time: x.as_of, value: x.composite }));
      if (scPts.length && this.$refs.chartScore) {
        const sc = this.chartBase(this.$refs.chartScore, 180);
        sc.addLineSeries({ color: '#34d399', lineWidth: 2, priceLineVisible: false })
          .setData(scPts);
      }

      price.timeScale().fitContent();
    },

    linkRanges(a, b) {
      // Two-way, guarded: applying a range fires the other chart's handler.
      let busy = false;
      const sync = (from, to) => from.timeScale().subscribeVisibleLogicalRangeChange(r => {
        if (busy || !r) return;
        busy = true;
        try { to.timeScale().setVisibleLogicalRange(r); } finally { busy = false; }
      });
      sync(a, b); sync(b, a);
    },

    // ---------- actions ----------
    async runNow() {
      this.busy.run = true;
      try {
        await this.api('POST', '/api/runs/daily', {});
        this.toast('Daily run fired. The brief lands when the pipeline finishes.', 'success');
      } catch (e) { this.toast('Run now: ' + e.message, 'error', 8000); }
      this.busy.run = false;
      this.refreshIcons();
    },

    openAdd() {
      this.addForm = { ticker: '', tags: '', target_entry: '', notes: '' };
      this.addModal = true;
      this.$nextTick(() => this.refreshIcons());
    },

    appendTag(t) {
      const cur = this.addForm.tags.split(',').map(s => s.trim()).filter(Boolean);
      if (!cur.includes(t)) cur.push(t);
      this.addForm.tags = cur.join(', ');
    },

    openEdit(w) {
      const tags = (w.tags || []).filter(t => t !== 'holding' && t !== 'benchmark');
      this.editForm = {
        ticker: w.ticker, name: w.name || '', tags: tags.join(', '),
        benchmark: (w.tags || []).includes('benchmark'),
        target_entry: w.target_entry ?? '', notes: w.notes || '',
      };
      this.editModal = true;
      this.$nextTick(() => this.refreshIcons());
    },

    appendEditTag(t) {
      if (t === 'holding' || t === 'benchmark') return;
      const cur = this.editForm.tags.split(',').map(s => s.trim()).filter(Boolean);
      if (!cur.includes(t)) cur.push(t);
      this.editForm.tags = cur.join(', ');
    },

    async submitEdit() {
      const row = this.watchlist.find(w => w.ticker === this.editForm.ticker);
      if (!row) { this.editModal = false; return; }
      const tags = this.editForm.tags.split(',').map(s => s.trim()).filter(Boolean)
        .filter(t => t !== 'holding' && t !== 'benchmark');
      if (this.editForm.benchmark) tags.push('benchmark');
      const changes = {
        name: this.editForm.name.trim() || null,
        tags,
        target_entry: this.editForm.target_entry === '' ? null : parseFloat(this.editForm.target_entry),
        notes: this.editForm.notes || null,
      };
      await this.patch(row, changes);
      this.editModal = false;
      await this.loadWatchlist();
    },

    async submitAdd() {
      const ticker = (this.addForm.ticker || '').trim().toUpperCase();
      if (!ticker) { this.toast('Ticker required', 'error'); return; }
      this.busy.add = true;
      try {
        const body = {
          ticker,
          tags: this.addForm.tags.split(',').map(s => s.trim()).filter(Boolean),
          target_entry: this.addForm.target_entry ? parseFloat(this.addForm.target_entry) : null,
          notes: this.addForm.notes || null,
        };
        const d = await this.api('POST', '/api/watchlist', body);
        const bf = d.backfill.fired ? 'backfill fired' : (d.backfill.error ? 'backfill FAILED: ' + d.backfill.error : (d.backfill.reason || 'no backfill'));
        this.toast(ticker + ' added (' + (d.profile.name || ticker) + '), ' + bf, d.backfill.error ? 'error' : 'success', 8000);
        this.addModal = false;
        await this.loadWatchlist();
      } catch (e) { this.toast('Add ' + ticker + ': ' + e.message, 'error', 8000); }
      this.busy.add = false;
      this.refreshIcons();
    },

    // Open a fresh Add-position form (broker-fill mode), ticker not yet chosen.
    newPosition() {
      this.posForm = { ticker: '', mode: 'dollars', amount: '', fill_price: '', qty: '', avg_cost: '',
                       opened_at: new Date().toISOString().slice(0, 10), notes: '', existing: false };
      this.posModal = true;
      this.$nextTick(() => this.refreshIcons());
    },

    openPosition(row) {
      const held = this.positions.find(p => p.ticker === row.ticker);
      const existing = !!(held || row.qty);
      this.posForm = {
        ticker: row.ticker,
        mode: existing ? 'shares' : 'dollars',
        amount: '', fill_price: '',
        qty: held ? held.qty : (row.qty ?? ''),
        avg_cost: held ? (held.avg_cost ?? '') : (row.avg_cost ?? ''),
        opened_at: held && held.opened_at ? held.opened_at : '',
        notes: held ? (held.notes || '') : '',
        existing,
      };
      this.posModal = true;
      this.$nextTick(() => this.refreshIcons());
    },

    async savePosition() {
      const ticker = (this.posForm.ticker || '').trim().toUpperCase();
      if (!ticker) { this.toast('Ticker is required', 'error'); return; }
      const { qty, avg_cost } = this.posComputed;
      if (!Number.isFinite(qty) || qty <= 0) {
        this.toast(this.posForm.mode === 'dollars' ? 'Enter amount spent and fill price' : 'Shares must be greater than zero', 'error');
        return;
      }
      this.busy.pos = true;
      try {
        const body = {
          qty,
          avg_cost: Number.isFinite(avg_cost) ? avg_cost : null,
          opened_at: this.posForm.opened_at || null,
          notes: this.posForm.notes || null,
        };
        const d = await this.api('PUT', '/api/positions/' + ticker, body);
        this.positions = d.positions;
        this.toast(ticker + ': ' + (Math.round(qty * 1e6) / 1e6) + ' shares saved', 'success');
        this.posModal = false;
        await this.loadWatchlist();
      } catch (e) { this.toast(ticker + ': ' + e.message, 'error', 8000); }
      this.busy.pos = false;
      this.refreshIcons();
    },

    async closePosition(ticker) {
      if (!confirm('Close the ' + ticker + ' position? The history row is kept.')) return;
      this.busy.pos = true;
      try {
        const d = await this.api('DELETE', '/api/positions/' + ticker);
        this.positions = d.positions;
        this.toast(ticker + ' position closed', 'success');
        this.posModal = false;
        await this.loadWatchlist();
      } catch (e) { this.toast(ticker + ': ' + e.message, 'error', 8000); }
      this.busy.pos = false;
      this.refreshIcons();
    },

    async patch(row, changes) {
      try {
        await this.api('PATCH', '/api/watchlist/' + row.ticker, changes);
        Object.assign(row, changes);
        if ('active' in changes) { this.toast(row.ticker + (changes.active ? ' reactivated' : ' retired'), 'success'); await this.loadWatchlist(); }
      } catch (e) { this.toast(row.ticker + ': ' + e.message, 'error'); }
      this.refreshIcons();
    },

    sortBy(key) {
      if (this.sort.key === key) this.sort.dir = this.sort.dir === 'asc' ? 'desc' : 'asc';
      else this.sort = { key, dir: key === 'ticker' ? 'asc' : 'desc' };
    },

    // ---------- token ----------
    saveToken() {
      const t = (this.tokenInput || '').trim();
      if (!t) return;
      this.token = t;
      localStorage.setItem('stock_intel_token', t);
      this.tokenInput = '';
      this.loadAll();
    },

    clearToken() {
      this.token = '';
      localStorage.removeItem('stock_intel_token');
    },

    // ---------- formatting ----------
    toast(msg, kind = 'info', ttl = 4000) {
      const id = Date.now() + Math.random();
      this.toasts.push({ id, msg, kind });
      this.$nextTick(() => this.refreshIcons());
      if (ttl > 0) setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id); }, ttl);
    },

    refreshIcons() { this.$nextTick(() => { if (window.lucide) lucide.createIcons(); }); },

    // ---------- analyst ----------
    async loadAnalysis(id) {
      clearTimeout(this.analysisTimer);
      if (!id) { this.analysis = null; return; }
      try {
        const d = await this.api('GET', '/api/analyses/' + id);
        this.analysis = d.analysis;
        if (this.analysis.output) {
          const o = this.analysis.output;
          for (const k of ['market_read', 'holdings', 'entries', 'avoid', 'questions', 'data_gaps']) o[k] = o[k] || [];
        }
        if (this.analysisBusy()) this.analysisTimer = setTimeout(() => this.loadAnalysis(id), 5000);
        this.loadSpend();   // the daily/re-analyze pass adds to today's spend when it lands
        this.refreshIcons();
      } catch (e) { this.toast('Analysis: ' + e.message, 'error'); }
    },
    analysisBusy() { return !!this.analysis && (this.analysis.status === 'pending' || this.analysis.status === 'running'); },
    async reanalyze() {
      if (!this.report) return;
      this.busy.analyze = true;
      try {
        const d = await this.api('POST', '/api/reports/' + this.report.report.as_of + '/analyze', {});
        this.toast(d.already_running ? 'Analysis already running' : 'Analyst started', 'success');
        await this.loadAnalysis(d.analysis_id);
        this.loadReports();
      } catch (e) { this.toast('Analyze: ' + e.message, 'error'); }
      this.busy.analyze = false;
    },
    async feedback(rating) {
      if (!this.analysis) return;
      this.busy.feedback = true;
      try {
        await this.api('POST', '/api/analyses/' + this.analysis.id + '/feedback', { rating, note: this.fbNote || null });
        this.fbNote = '';
        this.toast('Feedback saved', 'success');
        await this.loadAnalysis(this.analysis.id);
      } catch (e) { this.toast('Feedback: ' + e.message, 'error'); }
      this.busy.feedback = false;
    },
    fbVote(a) { return a && a.feedback && a.feedback.length ? a.feedback[0].rating : null; },
    stanceClass(s) { return s === 'add' ? 'pill-flag' : (s === 'trim' ? 'pill-risk' : (s === 'watch' ? 'pill-warn' : 'pill-hold')); },
    // analysisId: which analysis row holds the sources; omitted means the Today panel's analysis.
    chips(claim, analysisId) {
      if (!claim) return '';
      const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const aid = analysisId ? ` data-aid="${esc(analysisId)}"` : '';
      const parts = (claim.cites || []).map(id => {
        const short = id.replace(/^db:/, '').split(':').slice(0, 2).join(':');
        return `<button type="button" class="cite" data-ref="${esc(id)}"${aid} title="${esc(id)}">${esc(short)}</button>`;
      });
      if (claim.ungrounded && claim.ungrounded.length) parts.push(`<span class="cite cite-bad" title="level not within 15% of a cited level">ungrounded ${esc(claim.ungrounded.join(', '))}</span>`);
      return parts.join(' ');
    },
    async openSource(ref, analysisId) {
      let sources = this.analysis ? (this.analysis.sources || []) : [];
      if (analysisId) {
        if (!this.sourceCache[analysisId]) {
          try { this.sourceCache[analysisId] = (await this.api('GET', '/api/analyses/' + analysisId)).analysis.sources || []; }
          catch (e) { this.sourceCache[analysisId] = []; }
        }
        sources = this.sourceCache[analysisId];
      }
      const src = sources.find(x => x.ref === ref);
      this.source = src || { ref, kind: 'missing', excerpt: 'This citation is not among the stored sources.', payload: null };
      this.refreshIcons();
    },

    mdHtml(md) {
      if (!md) return '';
      return colorSigned(DOMPurify.sanitize(marked.parse(md)));
    },

    money(v, dp = 2) {
      if (v === null || v === undefined || v === '') return '-';
      const n = Number(v);
      return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
    },
    num(v, dp = 2) { return (v === null || v === undefined || v === '') ? '-' : Number(v).toFixed(dp); },
    shortModel(m) { return m ? String(m).split('/').pop() : '-'; },
    fmtTokens(n) { if (n === null || n === undefined) return '-'; return n >= 1000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'k' : String(n); },
    pct(v) { return (v === null || v === undefined) ? '-' : (Number(v) * 100).toFixed(1) + '%'; },
    signClass(v) { if (v === null || v === undefined) return 'text-ink-400'; return Number(v) > 0 ? 'text-ok' : (Number(v) < 0 ? 'text-danger' : ''); },
    pretty(o) { return o ? JSON.stringify(o, null, 2) : 'no reasons stored'; },
    fmtClock(ts) {
      if (!ts) return '';
      return new Date(ts).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    },
    fmtTime(ts) { if (!ts) return '-'; const d = new Date(ts); return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); },
    duration(r) {
      if (!r.started_at || !r.finished_at) return '-';
      const s = (new Date(r.finished_at) - new Date(r.started_at)) / 1000;
      return s < 60 ? s.toFixed(0) + 's' : (s / 60).toFixed(1) + 'm';
    },
    tagClass(t) {
      if (t === 'holding') return 'pill-hold';
      if (t === 'benchmark') return 'pill-bench';
      return 'pill-tag';
    },
  };
}
</script>
</body>
</html>
