                      <button class="btn btn-ghost btn-sm" :title="entryOpen === e.ticker ? 'Collapse' : 'Rationale'" @click="toggleEntry(e)">
                        <i :data-lucide="entryOpen === e.ticker ? 'chevron-up' : 'chevron-down'" class="w-3.5 h-3.5"></i>
                      </button>
                    </td>
                  </tr>
                  <tr x-show="entryOpen === e.ticker" class="bg-surface-2">
                    <td colspan="16" class="whitespace-normal">
                      <div class="grid grid-cols-3 gap-4 py-2 text-[13px]">
                        <div class="min-w-0">
                          <div class="label">Thesis</div>
                          <p class="text-ink-700 leading-relaxed" x-text="e.thesis || 'none written'"></p>
                          <div class="label mt-3">Rule read <span class="font-normal text-ink-400" x-text="'at ' + (e.price_as_of || '') + ' close'"></span></div>
                          <ul class="list-disc pl-4 text-ink-600 space-y-1.5 leading-relaxed">
                            <template x-for="(r, i) in e.rule.reasons" :key="'rr' + e.ticker + i"><li x-text="r"></li></template>
                          </ul>
                          <div class="text-[11px] text-ink-400 mt-2" x-show="e.notes" x-text="e.notes"></div>
                        </div>
                        <div class="col-span-2 min-w-0">
                          <template x-if="e.signal">
                            <div>
                              <div class="flex items-center gap-2 mb-2 flex-wrap">
                                <span class="label mb-0">Analyst</span>
                                <span class="pill" :class="sigClass(e.signal)" x-text="e.signal"></span>
                                <span class="text-[11px] text-ink-400" x-text="'confidence ' + Number(e.confidence || 0).toFixed(2) + ', run ' + fmtTime(e.signal_at) + ' on ' + (e.signal_as_of || '') + ' data at ' + num(e.ref_price, 2)"></span>
                                <span class="text-[11px] text-ink-400 mono" x-text="e.signal_model || ''"></span>
                                <button class="btn btn-ghost btn-sm ml-auto" @click="loadEntryHistory(e.ticker)"><i data-lucide="history" class="w-3.5 h-3.5"></i> History</button>
                              </div>
                              <p class="mb-1.5 text-ink-900" x-text="e.summary"></p>
                              <ul class="list-disc pl-4 space-y-1.5 leading-relaxed">
                                <template x-for="(c, i) in (e.rationale || [])" :key="'ec' + e.ticker + i">
                                  <li><span x-text="c.text"></span> <span x-html="chips(c, e.analysis_id)"></span></li>
                                </template>
                                <li x-show="e.signal_invalidation && e.signal_invalidation.text" class="text-ink-600">
                                  <span class="font-medium">Invalidation:</span> <span x-text="e.signal_invalidation.text"></span> <span x-html="chips(e.signal_invalidation, e.analysis_id)"></span>
                                </li>
                              </ul>
                              <div class="mt-2 text-xs" x-show="e.zone_check && e.zone_check !== 'holds'">
                                <span class="text-warn font-medium" x-text="'Zone check: ' + (e.zone_check === 'propose' ? 'proposed by the analyst' : e.zone_check)"></span>
                                <span x-show="e.suggested_zone" class="mono text-ink-600" x-text="' ' + num(e.suggested_zone && e.suggested_zone.low) + ' to ' + num(e.suggested_zone && e.suggested_zone.high) + (e.suggested_invalidation != null ? ', invalidation ' + num(e.suggested_invalidation) : '') + (e.suggested_zone && e.suggested_zone.ungrounded ? ' (ungrounded, cannot apply)' : '')"></span>
                                <button x-show="canApplyZone(e)" class="btn btn-secondary btn-sm ml-2" @click="acceptZone(e)" :disabled="busy.entry" title="Use this as the row's zone; you can still edit it">
                                  <i data-lucide="check" class="w-3.5 h-3.5"></i> Apply zone
                                </button>
                              </div>
                              <div class="mt-2" x-show="(e.watch_for || []).length">
                                <div class="label">Watch for</div>
                                <ul class="list-disc pl-4 text-ink-600 space-y-1.5 leading-relaxed">
                                  <template x-for="(w, i) in (e.watch_for || [])" :key="'wf' + e.ticker + i"><li x-text="w"></li></template>
                                </ul>
                              </div>
                            </div>
                          </template>
                          <template x-if="!e.signal">
                            <div class="text-xs text-ink-400">No analyst signal stored yet. It runs after every daily analysis, or press the sparkle.</div>
                          </template>
                          <template x-if="esig && esig.ticker === e.ticker">
                            <div class="mt-3 pt-3 border-t border-line">
                              <div class="label" x-text="'Signal history, ' + esig.signals.length + ' rows'"></div>
                              <table class="data-table">
                                <thead><tr><th>When</th><th>As of</th><th>Signal</th><th class="num">Conf</th><th class="num">Price</th><th>Zone check</th><th>Summary</th><th class="num">Cost</th></tr></thead>
                                <tbody>
                                  <template x-for="s in esig.signals" :key="'sh' + s.id">
                                    <tr>
                                      <td class="text-xs" x-text="fmtTime(s.created_at)"></td>
                                      <td class="mono text-xs" x-text="s.as_of"></td>
                                      <td><span class="pill" :class="sigClass(s.signal)" x-text="s.signal"></span></td>
                                      <td class="num" x-text="num(s.confidence, 2)"></td>
                                      <td class="num" x-text="num(s.ref_price, 2)"></td>
                                      <td class="text-xs" x-text="s.zone_check || '-'"></td>
                                      <td class="text-xs" :title="s.summary || ''"><div class="max-w-[420px] truncate" x-text="s.summary"></div></td>
                                      <td class="num text-xs" x-text="s.cost_usd != null ? '$' + Number(s.cost_usd).toFixed(3) : '-'"></td>
                                    </tr>
                                  </template>
                                </tbody>
                              </table>
                              <div class="label mt-3">Edits</div>
                              <template x-for="h in esig.history" :key="'eh' + h.id">
                                <div class="flex gap-3 text-[11px] text-ink-600">
                                  <span x-text="fmtTime(h.changed_at)"></span>
                                  <span class="pill" :class="statusClass(h.status)" x-text="h.status"></span>
                                  <span class="mono" x-text="(h.zone_low != null ? num(h.zone_low) + '-' + num(h.zone_high) : 'no zone') + (h.invalidation != null ? ', inval ' + num(h.invalidation) : '')"></span>
                                  <span x-text="h.changed_by"></span>
                                </div>
                              </template>
                            </div>
                          </template>
                        </div>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </template>
              <tbody x-show="!entries.length">
                <tr><td colspan="15" class="text-center text-ink-400 py-10">
                  Nothing on the entry watch list. Add a ticker; the analyst proposes a buy zone and signals it after each daily run.
                </td></tr>
              </tbody>
            </table>
            <div class="px-6 py-3 text-[11px] text-ink-400">
              Rule reads use the stored close; distance uses the live price when the market is open. Framework, not advice.
            </div>
          </div>
        </div>
      </template>

      <!-- =========================== TICKER ============================ -->
      <template x-if="screen === 'ticker'">
        <div class="flex-1 flex flex-col min-w-0">
          <header class="bg-[#0a0e18] border-b border-line px-6 py-3 flex items-center gap-3 sticky top-0 z-20">
            <button @click="history.length > 1 ? history.back() : (window.location.hash = 'watchlist')"
                    class="btn btn-ghost btn-icon" title="Back">
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
            </button>
            <div class="min-w-0">
              <h1 class="text-sm font-semibold leading-tight mono" x-text="tickerSym"></h1>
              <div class="text-xs text-ink-600 truncate" x-text="tk.row ? (tk.row.name || 'no name on file') : 'loading...'"></div>
            </div>
            <div class="flex gap-1 ml-2">
              <template x-for="t in (tk.row ? (tk.row.tags || []) : [])" :key="t">
                <span class="pill" :class="tagClass(t)" x-text="t"></span>
              </template>
              <span x-show="tk.row && !tk.row.active" class="pill pill-risk">retired</span>
            </div>
            <div class="ml-auto flex items-center gap-2">
              <div class="flex rounded-md border border-line overflow-hidden">
                <template x-for="r in tkRanges" :key="r.days">
                  <button class="px-2.5 py-1 text-xs border-r border-line last:border-r-0"
                          :class="tkDays === r.days ? 'bg-brand-600 text-[#04141f]' : 'bg-surface-2 text-ink-600 hover:bg-surface-3'"
                          @click="setTickerRange(r.days)" x-text="r.label"></button>
                </template>
              </div>
              <span x-show="quoteFor(tickerSym)" class="pill"
                    :class="marketOpen ? 'pill-flag' : 'pill-bench'"
                    x-text="(marketOpen ? 'live ' : 'last ') + num(quoteFor(tickerSym) ? quoteFor(tickerSym).price : null, 2)
                            + ' @ ' + fmtClock(quoteAt)"></span>
              <button class="btn btn-secondary btn-sm" disabled title="Phase C">
                <i data-lucide="brain" class="w-3.5 h-3.5"></i> Ask the analyst
              </button>
            </div>
          </header>

          <div class="flex-1 overflow-y-auto p-6 space-y-4">
            <!-- Stat strip -->
            <div class="grid grid-cols-8 gap-2">
              <template x-for="st in tkStats" :key="st.k">
                <div class="card p-2.5">
                  <div class="text-[10px] uppercase tracking-wide text-ink-400" x-text="st.k"></div>
                  <div class="mono text-sm font-medium" :class="st.cls || ''" x-text="st.v"></div>
                </div>
              </template>
            </div>

            <!-- Price -->
            <div class="card overflow-hidden">
              <div class="px-4 py-2.5 border-b border-line flex items-center gap-2">
                <i data-lucide="candlestick-chart" class="w-4 h-4 text-ink-600"></i>
                <span class="text-xs font-medium text-ink-700">Price, SMA 20 / 50 / 200 and volume</span>
                <div class="ml-auto flex items-center gap-3 text-[11px]">
                  <span class="flex items-center gap-1"><span class="inline-block w-3 h-0.5 bg-[#38bdf8]"></span>SMA20</span>
                  <span class="flex items-center gap-1"><span class="inline-block w-3 h-0.5 bg-[#f59e0b]"></span>SMA50</span>
                  <span class="flex items-center gap-1"><span class="inline-block w-3 h-0.5 bg-[#4a6a88]"></span>SMA200</span>
                  <span x-show="tk.markers.length" class="text-ink-400" x-text="tk.markers.length + ' position marks'"></span>
                </div>
              </div>
              <div x-ref="chartPrice" class="w-full" style="height: 360px"></div>
              <div x-show="!tk.bars.length" class="text-sm text-ink-400 py-10 text-center">No price history stored.</div>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <!-- RSI -->
              <div class="card overflow-hidden">
                <div class="px-4 py-2.5 border-b border-line flex items-center gap-2">
                  <i data-lucide="activity" class="w-4 h-4 text-ink-600"></i>
                  <span class="text-xs font-medium text-ink-700">RSI 14</span>
                  <span class="text-[11px] text-ink-400 ml-auto">70 overbought, 30 oversold</span>
                </div>
                <div x-ref="chartRsi" class="w-full" style="height: 180px"></div>
              </div>

              <!-- Composite -->
              <div class="card overflow-hidden">
                <div class="px-4 py-2.5 border-b border-line flex items-center gap-2">
                  <i data-lucide="trending-up" class="w-4 h-4 text-ink-600"></i>
                  <span class="text-xs font-medium text-ink-700">Composite score</span>
                  <span class="text-[11px] text-ink-400 ml-auto" x-text="tk.scores.length + ' scored day' + (tk.scores.length === 1 ? '' : 's')"></span>
                </div>
                <div x-ref="chartScore" class="w-full" style="height: 180px"></div>
                <div x-show="tk.scores.length < 2" class="px-4 py-3 text-[11px] text-ink-400">
                  One point is not a line. This fills in as the daily run accumulates.
                </div>
              </div>
            </div>

            <!-- Flag history -->
            <div class="card overflow-hidden">
              <div class="px-4 py-2.5 border-b border-line flex items-center gap-2">
                <i data-lucide="flag" class="w-4 h-4 text-ink-600"></i>
                <span class="text-xs font-medium text-ink-700">Every flag this ticker has carried</span>
                <span class="text-[11px] text-ink-400 ml-auto">Click a row for its evidence</span>
              </div>
              <table class="data-table">
                <thead>
                  <tr><th>Date</th><th class="num">Comp</th><th class="num">Mom</th><th class="num">Sent</th><th>Flags</th><th>Risks</th></tr>
                </thead>
                <tbody>
                  <template x-for="sc in tkFlagRows" :key="sc.as_of">
                    <tr class="cursor-pointer" @click="drawer = { ...sc, ticker: tickerSym, name: tk.row ? tk.row.name : '' }">
                      <td class="mono" x-text="sc.as_of"></td>
                      <td class="num font-medium" x-text="num(sc.composite, 1)"></td>
                      <td class="num" x-text="num(sc.momentum, 1)"></td>
                      <td class="num" x-text="num(sc.sentiment, 1)"></td>
                      <td><template x-for="f in (sc.flags || [])" :key="f"><span class="pill pill-flag mr-1" x-text="f"></span></template></td>
                      <td><template x-for="f in (sc.risks || [])" :key="f"><span class="pill pill-risk mr-1" x-text="f"></span></template></td>
                    </tr>
                  </template>
                  <tr x-show="!tkFlagRows.length"><td colspan="6" class="text-center text-ink-400 py-6">No scored days with flags yet.</td></tr>
                </tbody>
              </table>
            </div>

            <div class="grid grid-cols-3 gap-4 items-start">
              <!-- News -->
              <div class="col-span-2 card overflow-hidden">
                <div class="px-4 py-2.5 border-b border-line flex items-center gap-2">
                  <i data-lucide="newspaper" class="w-4 h-4 text-ink-600"></i>
                  <span class="text-xs font-medium text-ink-700">News</span>
                  <span class="text-[11px] text-ink-400" x-text="tk.news.length + ' articles'"></span>
                  <span x-show="tk.news.length && !tkHasSentiment" class="text-[11px] text-warn ml-auto">
                    No sentiment scored yet. Alpha Vantage supplies it; its daily quota was spent.
                  </span>
                </div>
                <div class="max-h-[520px] overflow-y-auto divide-y divide-line">
                  <template x-for="a in tk.news" :key="a.id">
                    <div class="px-4 py-2.5">
                      <div class="flex items-start gap-2">
                        <span x-show="a.sentiment !== null" class="pill flex-shrink-0"
                              :class="a.sentiment > 0.15 ? 'pill-flag' : (a.sentiment < -0.15 ? 'pill-risk' : 'pill-bench')"
                              x-text="num(a.sentiment, 2)"></span>
                        <div class="min-w-0">
                          <a :href="a.url" target="_blank" rel="noopener noreferrer"
                             class="text-[13px] text-ink-900 hover:text-brand-600 leading-snug" x-text="a.headline"></a>
                          <div class="text-[11px] text-ink-400 mt-0.5">
                            <span x-text="fmtTime(a.published_at)"></span> ·
                            <span class="mono" x-text="a.source"></span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </template>
                  <div x-show="!tk.news.length" class="px-4 py-8 text-center text-sm text-ink-400">No articles stored in this window.</div>
                </div>
              </div>

              <!-- Position + edits -->
              <div class="space-y-4">
                <div class="card p-4" x-show="tkPosition">
                  <div class="flex items-center gap-2 mb-3">
                    <i data-lucide="wallet" class="w-4 h-4 text-brand-600"></i>
                    <span class="text-sm font-semibold">Position</span>
                    <button class="btn btn-ghost btn-sm ml-auto" @click="openPosition(tk.row || { ticker: tickerSym })">
                      <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                  <template x-if="tkPosition">
                    <div class="space-y-1.5 text-[13px]">
                      <div class="flex justify-between"><span class="text-ink-600">Shares</span><span class="mono" x-text="num(tkPosition.qty, 6)"></span></div>
                      <div class="flex justify-between"><span class="text-ink-600">Avg cost</span><span class="mono" x-text="money(tkPosition.avg_cost)"></span></div>
                      <div class="flex justify-between"><span class="text-ink-600">Cost basis</span><span class="mono" x-text="money(tkPosition.cost_basis)"></span></div>
                      <div class="flex justify-between"><span class="text-ink-600">Value</span><span class="mono font-medium" x-text="money(tkPosition.market_value)"></span></div>
                      <div class="flex justify-between"><span class="text-ink-600">Gain</span>
                        <span class="mono" :class="signClass(tkPosition.gain)" x-text="money(tkPosition.gain) + ' (' + pct(tkPosition.gain_pct) + ')'"></span></div>
                      <div class="flex justify-between"><span class="text-ink-600">Weight</span><span class="mono" x-text="pct(tkPosition.weight)"></span></div>
                    </div>
                  </template>
                  <div class="border-t border-line mt-3 pt-2 space-y-1" x-show="tk.history.length">
                    <div class="label">History</div>
                    <template x-for="h in tk.history" :key="h.id">
                      <div class="flex justify-between text-[11px] text-ink-600">
                        <span x-text="fmtTime(h.changed_at)"></span>
                        <span class="mono" x-text="(h.qty > 0 ? num(h.qty, 3) + ' sh @ ' + money(h.avg_cost) : 'closed')"></span>
                      </div>
                    </template>
                  </div>
                </div>

                <div class="card p-4">
                  <div class="flex items-center gap-2 mb-3">
                    <i data-lucide="crosshair" class="w-4 h-4 text-brand-600"></i>
                    <span class="text-sm font-semibold">Entry watch</span>
                    <button class="btn btn-ghost btn-sm ml-auto" @click="openEntry(tkEntry || { ticker: tickerSym })">
                      <i :data-lucide="tkEntry ? 'pencil' : 'plus'" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                  <template x-if="tkEntry">
                    <div class="space-y-1.5 text-[13px]">
                      <div class="flex justify-between"><span class="text-ink-600">Status</span><span class="pill" :class="statusClass(tkEntry.status)" x-text="tkEntry.status"></span></div>
                      <div class="flex justify-between"><span class="text-ink-600">Zone</span><span class="mono" x-text="zoneText(tkEntry) + (tkEntry.zone_source === 'analyst' && tkEntry.zone_low != null ? ' (AI)' : '')"></span></div>
                      <div class="flex justify-between"><span class="text-ink-600">Distance</span><span class="mono" :class="distClass(tkEntry)" x-text="distText(tkEntry)"></span></div>
                      <div class="flex justify-between"><span class="text-ink-600">Invalidation</span><span class="mono" x-text="tkEntry.invalidation ? num(tkEntry.invalidation, 2) : '-'"></span></div>
                      <div class="flex justify-between"><span class="text-ink-600">Rule</span><span class="pill" :class="sigClass(tkEntry.rule.signal)" x-text="tkEntry.rule.signal"></span></div>
                      <div class="flex justify-between"><span class="text-ink-600">Analyst</span>
                        <span x-show="tkEntry.signal" class="pill" :class="sigClass(tkEntry.signal)" x-text="tkEntry.signal + ' ' + num(tkEntry.confidence, 2)"></span>
                        <span x-show="!tkEntry.signal" class="text-ink-400 text-xs">not yet</span></div>
                      <p class="text-xs text-ink-600 pt-1" x-show="tkEntry.summary" x-text="tkEntry.summary"></p>
                      <a href="#entries" class="text-[11px] text-brand-600 hover:underline" @click="entryOpen = tickerSym">Open rationale</a>
                    </div>
                  </template>
                  <div x-show="!tkEntry" class="text-xs text-ink-400">Not on the entry watch list. Add a zone to get signals.</div>
                </div>

                <div class="card p-4">
                  <div class="flex items-center gap-2 mb-3">
                    <i data-lucide="target" class="w-4 h-4 text-ink-600"></i>
                    <span class="text-sm font-semibold">Target and notes</span>
                  </div>
                  <label class="label">Target entry</label>
                  <input class="input input-sm mono" type="number" step="0.01" :value="tk.row ? tk.row.target_entry : ''"
                         @change="patchTicker({ target_entry: $event.target.value === '' ? null : parseFloat($event.target.value) })" />
                  <label class="label mt-3">Notes</label>
                  <textarea class="input input-sm" rows="3" :value="tk.row ? (tk.row.notes || '') : ''"
                            @change="patchTicker({ notes: $event.target.value })"></textarea>
                  <div class="text-[11px] text-ink-400 mt-2" x-show="tk.row && tk.row.target_entry && tk.row.close">
                    <span x-text="tk.row && tk.row.target_entry ? pct((tk.row.close - tk.row.target_entry) / tk.row.target_entry) : ''"></span> above target
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ============================ RUNS ============================= -->
      <template x-if="screen === 'runs'">
        <div class="flex-1 flex flex-col min-w-0">
          <header class="bg-[#0a0e18] border-b border-line px-6 py-3 flex items-center sticky top-0 z-20">
            <h1 class="text-sm font-semibold">Runs</h1>
            <div class="ml-auto flex gap-2">
              <button @click="loadRuns()" class="btn btn-secondary btn-sm"><i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh</button>
              <button @click="runNow()" class="btn btn-primary btn-sm" :disabled="busy.run"><i data-lucide="play" class="w-3.5 h-3.5"></i> Run now</button>
            </div>
          </header>
          <div class="flex-1 overflow-y-auto p-6">
            <div class="card overflow-hidden">
              <table class="data-table">
                <thead><tr><th>Started</th><th>Kind</th><th>As of</th><th>Status</th><th class="num">Duration</th><th>Sources</th></tr></thead>
                <tbody>
                  <template x-for="r in runs" :key="r.run_id">
                    <tr>
                      <td class="mono text-xs" x-text="fmtTime(r.started_at)"></td>
                      <td x-text="r.kind"></td>
                      <td class="mono text-xs" x-text="r.as_of"></td>
                      <td><span class="pill" :class="r.status === 'ok' || r.status === 'done' ? 'pill-flag' : (r.status === 'running' ? 'pill-warn' : 'pill-risk')" x-text="r.status"></span></td>
                      <td class="num" x-text="duration(r)"></td>
                      <td class="whitespace-normal">
                        <template x-for="s in (r.sources || [])" :key="s.source">
                          <span class="pill mr-1" :class="s.error > 0 ? 'pill-risk' : (s.ok === 0 ? 'pill-warn' : 'pill-bench')"
                                x-text="s.source + ' ' + s.ok + (s.error ? '/' + s.error + 'e' : '')"></span>
                        </template>
                      </td>
                    </tr>
                  </template>
                  <tr x-show="!runs.length"><td colspan="6" class="text-center text-ink-400 py-8">No runs recorded.</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </template>

      <!-- ========================== SETTINGS =========================== -->
      <template x-if="screen === 'settings'">
        <div class="flex-1 flex flex-col min-w-0">
          <header class="bg-[#0a0e18] border-b border-line px-6 py-3 flex items-center sticky top-0 z-20">
            <h1 class="text-sm font-semibold">Settings</h1>
            <span class="ml-2 text-xs text-ink-400">intel.config, versioned on every write</span>
            <button @click="saveSettings()" class="btn btn-primary btn-sm ml-auto" :disabled="busy.config">
              <i data-lucide="save" class="w-3.5 h-3.5"></i> Save
            </button>
          </header>
          <div class="flex-1 overflow-y-auto p-6 space-y-4">

            <!-- ===== Models ===== -->
            <div class="card max-w-[980px]">
              <div class="px-5 py-3 border-b border-line flex items-center gap-2">
                <i data-lucide="cpu" class="w-4 h-4 text-brand-600"></i>
                <span class="text-sm font-semibold">Models</span>
                <span class="text-xs text-ink-400">Providers hold an endpoint and the name of the environment variable that carries the key. Keys never enter the database.</span>
              </div>

              <!-- Providers -->
              <div class="px-5 pt-4">
                <div class="label">Providers</div>
                <table class="data-table">
                  <thead><tr><th>Name</th><th>Kind</th><th>Endpoint</th><th>Key variable</th><th>Enabled</th><th></th></tr></thead>
                  <tbody>
                    <template x-for="(p, i) in providers" :key="p.id">
                      <tr>
                        <td><span class="font-medium" x-text="p.name"></span> <span class="mono text-[11px] text-ink-400" x-text="p.id"></span></td>
                        <td><span class="pill pill-tag" x-text="p.kind"></span></td>
                        <td class="mono text-[11px] text-ink-600" x-text="p.base_url"></td>
                        <td>
                          <span class="inline-block w-2 h-2 rounded-full mr-1.5" :class="p.key_present ? 'bg-ok' : 'bg-danger'"></span>
                          <span class="mono text-[11px]" x-text="p.key_env"></span>
                          <span class="text-[11px] text-ink-400" x-show="!p.key_present"> not set</span>
                        </td>
                        <td><input type="checkbox" class="tgl" x-model="p.enabled"></td>
                        <td class="whitespace-nowrap">
                          <button class="btn btn-secondary btn-sm" @click="testProvider(p.id)" :disabled="busy.test === p.id">
                            <i :data-lucide="busy.test === p.id ? 'loader-2' : 'plug-zap'" class="w-3.5 h-3.5" :class="busy.test === p.id ? 'spin' : ''"></i> Test
                          </button>
                          <button class="btn btn-ghost btn-sm" title="Remove provider" @click="removeProvider(i)" :disabled="providers.length < 2">
                            <i data-lucide="x" class="w-3.5 h-3.5"></i>
                          </button>
                          <div class="text-[11px] mt-1 font-sans" x-show="testResult[p.id]"
                               :class="testResult[p.id] && testResult[p.id].ok ? 'text-ok' : 'text-danger'" x-text="testSummary(p.id)"></div>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>

                <div class="mt-3" x-show="!showAddProv">
                  <button class="btn btn-secondary btn-sm" @click="showAddProv = true; newProvKind()"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Add provider</button>
                </div>
                <div class="mt-3 p-3 rounded-md bg-surface-2 border border-line" x-show="showAddProv">
                  <div class="grid grid-cols-5 gap-2">
                    <div><label class="label">Kind</label>
                      <select class="select-input input-sm" x-model="newProv.kind" @change="newProvKind()">
                        <template x-for="k in Object.keys(providerKinds)" :key="k"><option :value="k" x-text="k"></option></template>
                      </select></div>
                    <div><label class="label">Id</label><input class="input input-sm mono" x-model="newProv.id" placeholder="anthropic-direct"></div>
                    <div><label class="label">Name</label><input class="input input-sm" x-model="newProv.name" placeholder="Anthropic direct"></div>
                    <div><label class="label">Endpoint</label><input class="input input-sm mono" x-model="newProv.base_url"></div>
                    <div><label class="label">Key variable</label><input class="input input-sm mono" x-model="newProv.key_env"></div>
                  </div>
                  <div class="flex items-center gap-2 mt-2">
                    <button class="btn btn-primary btn-sm" @click="addProvider()">Add</button>
                    <button class="btn btn-ghost btn-sm" @click="showAddProv = false">Cancel</button>
                    <span class="text-[11px] text-ink-400">Then put the key in <span class="mono">.env</span> under that variable name and restart the app container. The dot turns green when the app sees it.</span>
                  </div>
                </div>
              </div>

              <!-- Roles -->
              <div class="px-5 pt-5">
                <div class="label">Roles</div>
                <div class="space-y-3">
                  <template x-for="r in roleDefs" :key="r.key">
                    <div class="grid grid-cols-12 gap-3 items-start">
                      <div class="col-span-3">
                        <div class="text-[13px] font-medium" x-text="r.label"></div>
                        <div class="text-[11px] text-ink-400" x-text="r.hint"></div>
                        <div class="mono text-[10px] text-ink-400 mt-1" x-text="r.key"></div>
                      </div>
                      <div class="col-span-2">
                        <select class="select-input input-sm" x-model="roles[r.key].provider" @change="ensureCatalog(roles[r.key].provider)">
                          <template x-for="p in providers.filter(p => p.enabled)" :key="p.id"><option :value="p.id" x-text="p.name"></option></template>
                        </select>
                      </div>
                      <div class="col-span-7">
                        <div class="flex gap-2">
                          <input class="input input-sm" style="max-width: 200px" placeholder="filter models" x-model="roles[r.key].q">
                          <select class="select-input input-sm mono text-[12px]" x-model="roles[r.key].model" x-effect="catalogs[roles[r.key].provider]; roles[r.key].q; $nextTick(() => { $el.value = roles[r.key].model })">
                            <template x-if="!modelInCatalog(roles[r.key])">
                              <option :value="roles[r.key].model" x-text="roles[r.key].model + '  (not in catalog)'"></option>
                            </template>
                            <template x-for="m in filteredModels(roles[r.key].provider, roles[r.key].q, roles[r.key].model)" :key="m.id">
                              <option :value="m.id" x-text="modelLabel(m)"></option>
                            </template>
                          </select>
                        </div>
                        <div class="text-[11px] mt-1 flex items-center gap-2">
                          <span class="text-ink-400" x-text="catalogHint(roles[r.key].provider)"></span>
                          <span class="text-warn" x-show="isStale(roles[r.key])">saved model is not in the live catalog</span>
                          <span class="text-ink-400" x-text="modelMeta(roles[r.key])"></span>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Bake-off set -->
              <div class="px-5 pt-5 pb-5">
                <div class="label">Bake-off set <span class="font-normal text-ink-400">analyst_bakeoff_models, the challengers eval_models.py runs against the analyst model</span></div>
                <div class="flex flex-wrap gap-1.5 mb-2">
                  <template x-for="(b, i) in bakeoff" :key="b.provider + ':' + b.model">
                    <span class="pill pill-tag mono">
                      <span x-text="(b.provider === 'openrouter' ? '' : b.provider + ':') + b.model"></span>
                      <button class="ml-1 text-ink-400 hover:text-danger" @click="bakeoff.splice(i, 1)" title="Remove">&times;</button>
                    </span>
                  </template>
                  <span class="text-xs text-ink-400" x-show="!bakeoff.length">No challengers yet.</span>
                </div>
                <div class="flex gap-2 items-center">
                  <select class="select-input input-sm" style="max-width: 160px" x-model="bakeAdd.provider" @change="ensureCatalog(bakeAdd.provider)">
                    <template x-for="p in providers.filter(p => p.enabled)" :key="p.id"><option :value="p.id" x-text="p.name"></option></template>
                  </select>
                  <input class="input input-sm" style="max-width: 200px" placeholder="filter models" x-model="bakeAdd.q">
                  <select class="select-input input-sm mono text-[12px]" x-model="bakeAdd.model">
                    <option value="">choose a model</option>
                    <template x-for="m in filteredModels(bakeAdd.provider, bakeAdd.q, '')" :key="m.id">
                      <option :value="m.id" x-text="modelLabel(m)"></option>
                    </template>
                  </select>
                  <button class="btn btn-secondary btn-sm" @click="addBakeoff()" :disabled="!bakeAdd.model"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Add</button>
                </div>
                <div class="text-[11px] text-ink-400 mt-2">Only models with tool calling and structured output can run the full agent; the others still qualify for draft-only evaluation.</div>
              </div>
            </div>

            <!-- ===== Analyst ===== -->
            <div class="card max-w-[980px]">
              <div class="px-5 py-3 border-b border-line flex items-center gap-2">
                <i data-lucide="brain" class="w-4 h-4 text-brand-600"></i>
                <span class="text-sm font-semibold">Analyst</span>
              </div>
              <div class="px-5 py-4 grid grid-cols-3 gap-4">
                <div><label class="label">Daily spend cap, USD <span class="mono text-ink-400">analyst_daily_cap_usd</span></label>
                  <input type="number" step="0.25" min="0" class="input input-sm mono" x-model.number="cfg.analyst_daily_cap_usd"></div>
                <div><label class="label">Web fetches per run <span class="mono text-ink-400">analyst_max_fetches</span></label>
                  <input type="number" step="1" min="0" class="input input-sm mono" x-model.number="cfg.analyst_max_fetches"></div>
                <div><label class="label">Search provider <span class="mono text-ink-400">analyst_search_provider</span></label>
                  <select class="select-input input-sm" x-model="cfg.analyst_search_provider"><option value="brave">brave</option><option value="marketaux">marketaux</option><option value="tavily">tavily</option></select></div>
                <div class="flex items-center gap-2 pt-1"><input type="checkbox" class="tgl" x-model="cfg.analyst_hitl"><div><div class="text-[13px]">Human review before persist</div><div class="text-[11px] text-ink-400 mono">analyst_hitl, applies to the weekly deep pass</div></div></div>
                <div class="flex items-center gap-2 pt-1"><input type="checkbox" class="tgl" x-model="cfg.analyst_share_positions_offsite"><div><div class="text-[13px]">Share position sizes with the model</div><div class="text-[11px] text-ink-400 mono">analyst_share_positions_offsite</div></div></div>
                <div class="flex items-center gap-2 pt-1"><input type="checkbox" class="tgl" x-model="cfg.entry_signal_auto"><div><div class="text-[13px]">Signal the entry watch list after each daily analysis</div><div class="text-[11px] text-ink-400 mono">entry_signal_auto</div></div></div>
                <div><label class="label">Near-zone threshold, fraction <span class="mono text-ink-400">entry_near_pct</span></label>
                  <input type="number" step="0.005" min="0" max="0.5" class="input input-sm mono" x-model.number="cfg.entry_near_pct"></div>
                <div><label class="label">Tickers per entry pass, max 8 <span class="mono text-ink-400">entry_signal_batch</span></label>
                  <input type="number" step="1" min="1" max="8" class="input input-sm mono" x-model.number="cfg.entry_signal_batch"></div>
                <div class="flex items-center gap-2 pt-1"><input type="checkbox" class="tgl" x-model="cfg.entry_watch_holdings"><div><div class="text-[13px]">Watch every holding for a dip to add on</div><div class="text-[11px] text-ink-400 mono">entry_watch_holdings</div></div></div>
                <div><label class="label">Add zone tops out this far below the average cost, fraction <span class="mono text-ink-400">entry_dca_min_discount</span></label>
                  <input type="number" step="0.005" min="0" max="0.5" class="input input-sm mono" x-model.number="cfg.entry_dca_min_discount"></div>
                <div><label class="label">Prompt set</label><div class="mono text-[12px] pt-1" x-text="(cfg.analyst_prompt_version || 'v1') + ' · files in app/prompts'"></div></div>
                <div class="col-span-3"><label class="label">News domains the web tools may read, one per line <span class="mono text-ink-400">news_domains</span></label>
                  <textarea class="input mono text-[12px]" rows="4" x-model="newsDomainsText"></textarea></div>
              </div>
            </div>

            <!-- ===== Pipeline ===== -->
            <div class="card max-w-[980px]">
              <div class="px-5 py-3 border-b border-line flex items-center gap-2">
                <i data-lucide="workflow" class="w-4 h-4 text-brand-600"></i>
                <span class="text-sm font-semibold">Pipeline and brief</span>
              </div>
              <div class="px-5 py-4 grid grid-cols-3 gap-4">
                <div class="flex items-center gap-2"><input type="checkbox" class="tgl" x-model="cfg.notify_email"><div><div class="text-[13px]">Email the brief</div><div class="text-[11px] text-ink-400 mono">notify_email</div></div></div>
                <div class="flex items-center gap-2"><input type="checkbox" class="tgl" x-model="cfg.email_position_values"><div><div class="text-[13px]">Share counts and values in the email</div><div class="text-[11px] text-ink-400 mono">email_position_values</div></div></div>
                <div></div>
                <div class="col-span-3">
                  <label class="label">Score weights <span class="mono text-ink-400">weights</span> <span class="text-ink-400" x-text="'sum ' + weightSum().toFixed(2)"></span></label>
                  <div class="grid grid-cols-4 gap-2">
                    <template x-for="k in ['momentum','value','sentiment','catalyst']" :key="k">
                      <div><div class="text-[11px] text-ink-400 mono mb-1" x-text="k"></div><input type="number" step="0.05" min="0" max="1" class="input input-sm mono" x-model.number="weights[k]"></div>
                    </template>
                  </div>
                </div>
                <div class="col-span-3"><label class="label">Free-tier quota per weekday <span class="mono text-ink-400">quota</span></label>
                  <textarea class="input mono text-[12px]" rows="2" x-model="cfgRaw.quota"></textarea></div>
                <div>
                  <label class="label">App URL n8n calls back <span class="mono text-ink-400">app_base_url</span></label>
                  <input class="input input-sm mono" x-model="cfg.app_base_url" placeholder="http://app:8095">
                </div>
                <div>
                  <label class="label">Telegram chat id <span class="mono text-ink-400">telegram.chat_id</span></label>
                  <input class="input input-sm mono" x-model="telegram.chat_id" placeholder="blank = no push">
                </div>
                <div class="flex items-center gap-2 pt-5">
                  <input type="checkbox" class="tgl" x-model="telegram.send_document">
                  <div><div class="text-[13px]">Attach the full brief</div><div class="text-[11px] text-ink-400 mono">telegram.send_document</div></div>
                </div>
              </div>
            </div>

            <!-- ===== Advanced ===== -->
            <details class="card max-w-[980px]">

              </div>

      </template>
